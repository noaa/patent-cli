name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: macOS-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            asset: gp-cli-darwin-arm64
            build_mcpb: true
            mcpb_asset: patent-cli-darwin-arm64.mcpb
          - os: macOS-amd64
            runner: macos-latest
            goos: darwin
            goarch: amd64
            asset: gp-cli-darwin-amd64
            build_mcpb: true
            mcpb_asset: patent-cli-darwin-amd64.mcpb
          - os: Linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: gp-cli-linux-amd64
            build_mcpb: false
          - os: Windows-amd64
            runner: ubuntu-latest
            goos: windows
            goarch: amd64
            asset: gp-cli-windows-amd64.exe
            build_mcpb: true
            mcpb_asset: patent-cli-windows-amd64.mcpb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags "-X main.version=${{ github.ref_name }}" \
            -o ${{ matrix.asset }} ./cmd/gp-cli/

      - name: Package (non-Windows)
        if: matrix.goos != 'windows'
        run: |
          tar czf ${{ matrix.asset }}.tar.gz ${{ matrix.asset }}

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        run: |
          zip ${{ matrix.asset }}.zip ${{ matrix.asset }}

      - name: Build .mcpb desktop extension
        if: matrix.build_mcpb
        run: |
          BINARY_NAME=gp-cli
          if [ "${{ matrix.goos }}" = "windows" ]; then BINARY_NAME=gp-cli.exe; fi
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          CMD='${__dirname}/server/'"${BINARY_NAME}"

          mkdir -p mcpb-build/server
          cp ${{ matrix.asset }} mcpb-build/server/${BINARY_NAME}

          jq --arg v "$VERSION" \
             --arg ep "server/${BINARY_NAME}" \
             --arg cmd "$CMD" \
             '.version = $v | .server.entry_point = $ep | .server.mcp_config.command = $cmd' \
             desktop-extension/manifest.json > mcpb-build/manifest.json

          cd mcpb-build && zip -r ../${{ matrix.mcpb_asset }} manifest.json server/ && cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
            ${{ matrix.mcpb_asset }}
          if-no-files-found: ignore

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            install.sh
            install.ps1
            install.bat
          fail_on_unmatched_files: false
